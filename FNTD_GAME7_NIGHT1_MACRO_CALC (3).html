<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNTD Macro Calculator</title>
    <style>
        /* Light Mode Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            opacity: 0;
            animation: slideUp 0.6s forwards 0.5s;
        }

        h1 {
            text-align: center;
            color: #388e3c; /* Slightly darker green for better contrast */
            margin-bottom: 20px;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: 600;
            color: ;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f9f9f9;
            color: #333; /* Ensure input text is dark enough for readability */
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #388e3c;
            outline: none;
            background-color: #fff;
            box-shadow: 0 0 8px rgba(56, 142, 60, 0.5);
        }

        button {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #388e3c; /* Darker green for more contrast */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s, transform 0.3s;
        }

        button:hover {
            background-color: #2c6c2b; /* Darker shade of green for hover */
            transform: scale(1.05);
        }

        .results {
            margin-top: 30px;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            opacity: 0;
            animation: fadeIn 0.5s forwards 1s;
        }

        .results h2 {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .results p {
            font-size: 16px;
            color: #555;
            margin: 10px 0;
        }

        .results span {
            font-weight: bold;
            color: #333;
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background-color: #121212; /* Slightly lighter dark background */
            color: #e0e0e0;
        }

        .container.dark-mode {
            background-color: #1e1e1e;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        h1.dark-mode {
            color: #66bb6a; /* Light green to keep contrast */
        }

        label.dark-mode {
            color: gray;
        }

        input.dark-mode {
            background-color: #333;
            color: #e0e0e0;
            border: 1px solid #555;
        }

        input.dark-mode:focus {
            border-color: #66bb6a;
            background-color: #444;
            box-shadow: 0 0 8px rgba(102, 187, 106, 0.5);
        }

        button.dark-mode {
            background-color: #333;
            color: #e0e0e0;
        }

        button.dark-mode:hover {
            background-color: #444;
            transform: scale(1.05);
        }

        .results.dark-mode {
            background-color: #333;
            color: #e0e0e0;
        }

        .results h2.dark-mode {
            color: #66bb6a;
        }

        .results p, .results span {
            color: #ccc;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>FNTD Macro Calculator</h1>
        
        <label for="timePerRun">Time per Run (Seconds):</label>
        <input type="number" id="timePerRun" placeholder="Enter time in seconds">

        <label for="totalTime">Total Time (hours):</label>
        <input type="number" id="totalTime" placeholder="Enter total time in hours">

        <label for="indexMultiplier">Index Multiplier:</label>
        <input type="number" id="indexMultiplier" placeholder="Enter multiplier">

        <button onclick="calculateRewards()">Calculate</button>

        <h2>Results:</h2>
        <div class="results">
            <p>Coins: <span id="coins">0</span></p>
            <p>Souls: <span id="soulsRange">0 - 0 (Average: 0)</span></p>
          <p>Wins: <span id="totalWins">0</span></p>
            <p>Corrupted Presents: <span id="corruptedPresents">0</span></p>
            <p>Agonies: <span id="agonies">0</span></p>
            <p>Flashlights: <span id="flashlights">0</span></p>
        </div>

        <button id="darkModeButton" onclick="toggleDarkMode()">Switch to Dark Mode</button>
    </div>

    <script>
        function calculateRewards() {
            const timePerRun = parseFloat(document.getElementById("timePerRun").value);
            const totalTime = parseFloat(document.getElementById("totalTime").value);
            const indexMultiplier = parseFloat(document.getElementById("indexMultiplier").value);
            
            if (isNaN(timePerRun) || isNaN(totalTime) || isNaN(indexMultiplier)) {
                alert("Please enter valid numbers for all fields.");
                return;
            }

            const totalTimeInSeconds = totalTime * 60 * 60;
            const totalRuns = Math.floor((totalTimeInSeconds / timePerRun) * 0.9); 

            const coinsPerRun = 376;
            const totalCoins = totalRuns * coinsPerRun * indexMultiplier;

            const minSouls = 12;
            const maxSouls = 16;
            const avgSouls = (minSouls + maxSouls) / 2;
            const totalMinSouls = totalRuns * minSouls;
            const totalMaxSouls = totalRuns * maxSouls;
            const totalAvgSouls = totalRuns * avgSouls;

            const corruptedPresents = Math.floor(totalRuns * 0.0125);
            const totalCorruptedValue = corruptedPresents * 1000;
            const totalWins = totalRuns;
            const agonies = Math.floor(totalRuns * 0.05);
            const avgAgonyValue = (50 + 100) / 2;
            const totalAgonyValue = agonies * avgAgonyValue;

            const avgFlashlightsPerRun = 0.75 * (1 + 2 + 3 + 4 + 5) / 5;
            const totalAvgFlashlights = Math.round(totalRuns * avgFlashlightsPerRun);

            document.getElementById("coins").innerText = totalCoins.toLocaleString();
            document.getElementById("soulsRange").innerText = `${totalMinSouls.toLocaleString()} - ${totalMaxSouls.toLocaleString()} (Average: ${totalAvgSouls.toLocaleString()})`;
           document.getElementById("totalWins").innerText = totalWins.toLocaleString(); document.getElementById("corruptedPresents").innerText = `${corruptedPresents} (Value: ${totalCorruptedValue.toLocaleString()} souls)`;
            document.getElementById("agonies").innerText = `${agonies} (Average Value: ${totalAgonyValue.toLocaleString()} souls)`;
            document.getElementById("flashlights").innerText = totalAvgFlashlights;
        }

        function toggleDarkMode() {
            const body = document.body;
            const darkModeButton = document.getElementById("darkModeButton");

            // Log to check if toggling is working
            console.log("Toggling dark mode");
            body.classList.toggle("dark-mode");
            const container = document.querySelector(".container");
            container.classList.toggle("dark-mode");

            const inputs = document.querySelectorAll("input");
            inputs.forEach(input => input.classList.toggle("dark-mode"));

            const results = document.querySelector(".results");
            results.classList.toggle("dark-mode");

            // Log the current mode
            console.log("Current mode:", body.classList.contains("dark-mode") ? "Dark" : "Light");
            
            if (body.classList.contains("dark-mode")) {
                darkModeButton.innerText = "Switch to Light Mode";
            } else {
                darkModeButton.innerText = "Switch to Dark Mode";
            }
        }
    </script>
</body>
</html>
